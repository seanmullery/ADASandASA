<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Assistance Systems: Demonstrations</title>
<style>
:root{--teal:#005B5E;--navy:#001A79;--lblue:#7BB9CB;--bg:#f4f7f8;--card:#fff;--ink:#14213d;--muted:#5b6770;--line:#d3dce1;--head:#001A79}
@media (prefers-color-scheme: dark){:root{--bg:#0b1524;--card:#13213a;--ink:#e8eef3;--muted:#9fb0bf;--line:#2b3d5a;--head:#7BB9CB}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:4px solid var(--teal);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:18px;padding:12px 22px 6px;max-width:1220px;margin:0 auto}
.top img{height:54px;width:auto}
.top h1{margin:0;font-size:1.4rem;color:var(--head)}
.top div.sub{color:var(--muted);font-size:.9rem}
nav{display:flex;gap:4px;padding:6px 22px 0;max-width:1220px;margin:0 auto;overflow-x:auto}
.tab{-webkit-appearance:none;appearance:none;font:inherit;font-weight:600;padding:9px 18px;border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;background:var(--bg);color:var(--muted);cursor:pointer;white-space:nowrap;touch-action:manipulation}
.tab[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.pane{display:none} .pane.on{display:block}
iframe{display:block;width:100%;border:0;min-height:600px;background:transparent}
footer{max-width:1180px;margin:0 auto;padding:4px 18px 24px;color:var(--muted);font-size:.85rem}
</style>

<script>
(function(){
  var KEYS = ['aeb','acc','sensors','levels'], made = {};
  function decode(k){
    var b = atob(document.getElementById('src-'+k).textContent.trim()), u = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) u[i] = b.charCodeAt(i);
    return new TextDecoder('utf-8').decode(u);
  }
  function show(k){
    if (KEYS.indexOf(k) < 0) k = KEYS[0];
    KEYS.forEach(function(x){
      document.getElementById('pane-'+x).classList.toggle('on', x===k);
      document.getElementById('tab-'+x).setAttribute('aria-selected', x===k ? 'true' : 'false');
    });
    var pane = document.getElementById('pane-'+k);
    if (!made[k]){
      var f = document.createElement('iframe');
      f.title = document.getElementById('tab-'+k).textContent;
      f.srcdoc = decode(k);
      pane.appendChild(f); made[k] = f;
    }
    try { made[k].contentWindow.focus(); } catch(e){}
    if (history.replaceState) history.replaceState(null, '', '#'+k);
  }
  window.addEventListener('message', function(e){
    if (!e.data || !e.data.canDemoHeight) return;
    KEYS.forEach(function(k){ if (made[k] && made[k].contentWindow === e.source) made[k].style.height = (e.data.canDemoHeight + 2) + 'px'; });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){ show(t.getAttribute('data-k')); });
  });
  window.addEventListener('hashchange', function(){ show((location.hash || '').slice(1)); });
  show((location.hash || '').slice(1));
})();
</script>
